name: Stock & Price Check

on:
  schedule:
    # 21:30 UTC = 18:30 ART, lunes a viernes
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_email:
        description: 'Forzar envío de email aunque no haya cambios'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      test_recipient:
        description: 'Email de prueba (deja vacío para usar RECIPIENT_EMAILS)'
        required: false
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run stock check
        env:
          FIREBASE_SECRET:    ${{ secrets.FIREBASE_SECRET }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAILS:   ${{ secrets.RECIPIENT_EMAILS }}
          FORCE_EMAIL:        ${{ github.event.inputs.force_email || 'false' }}
          TEST_RECIPIENT:     ${{ github.event.inputs.test_recipient || '' }}
        run: python scripts/stock_check.py

      - name: Commit updated snapshot files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f stock_diff_latest.json stock_snapshot_latest.json
          git diff --cached --quiet || git commit -m "chore: stock check $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
