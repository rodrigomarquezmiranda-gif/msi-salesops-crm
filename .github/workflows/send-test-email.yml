name: Send Test Email (uso único)

on:
  workflow_dispatch:
    inputs:
      test_recipient:
        description: 'Email destinatario de prueba'
        required: true
        default: 'rodrigomarquezmiranda@gmail.com'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install openpyxl --break-system-packages

      - name: Write combined test diff
        run: |
          python3 - << 'PYEOF'
          import json
          from datetime import datetime, timezone

          changes = [
              {"type":"new","partNo":"SM470PN1TB","name":"SPATIUM M470 PRO PCIe 4.0 NVMe M.2 1TB","category":"SSD","newPrice":145.0},
              {"type":"new","partNo":"SM470PN2TB","name":"SPATIUM M470 PRO PCIe 4.0 NVMe M.2 2TB","category":"SSD","newPrice":245.0},
              {"type":"new","partNo":"PRO DP21 14MA-267BUS","name":"PRO DP21 14MA-267BUS","category":"CUBI","newPrice":182.0},
              {"type":"removed","partNo":"PRO DP21 14AM","name":"PRO DP21 14AM","category":"CUBI"},
          ]
          diff = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "productCount": 301,
              "hasChanges": True,
              "changeCount": len(changes),
              "changes": changes,
              "summary": f"{len(changes)} cambio(s) detectado(s) (07/09 – 09/09)",
              "triggeredBy": "github-actions",
              "triggerMode": "manual",
          }
          with open("stock_diff_latest.json", "w") as f:
              json.dump(diff, f, ensure_ascii=False, indent=2)
          print("Diff escrito OK")
          PYEOF

      - name: Send email
        env:
          FIREBASE_SECRET:  ${{ secrets.FIREBASE_SECRET }}
          SMTP_PASSWORD:    ${{ secrets.SMTP_PASSWORD }}
          TEST_RECIPIENT:   ${{ github.event.inputs.test_recipient }}
          USE_LOCAL_DIFF:   'true'
          FORCE_EMAIL:      'true'
        run: python scripts/stock_check.py
